<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AutoMotor License Admin</title><style>
*{box-sizing:border-box}body{margin:0;background:#071426;color:#f3f7ff;font:14px Arial,sans-serif}.wrap{max-width:1100px;margin:30px auto;padding:0 16px}.card{background:#10233d;border:1px solid #29476d;border-radius:14px;padding:18px;margin:14px 0}h1{font-size:26px;margin:0 0 6px}p{color:#b7c8df}input,button{padding:10px;border-radius:8px;border:1px solid #3b5a80;background:#071426;color:white}input{width:100%;margin:5px 0 12px}button{cursor:pointer;background:#ff812e;border:0;color:#171717;font-weight:700;margin:3px}button.secondary{background:#244364;color:white}button.danger{background:#a92e37;color:white}.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}table{width:100%;border-collapse:collapse;display:block;overflow:auto}td,th{text-align:left;padding:10px;border-bottom:1px solid #29476d;white-space:nowrap}th{color:#a9c7ee}.muted{color:#9bb1ce;font-size:12px}#status{white-space:pre-wrap;color:#ffbd8b;overflow-wrap:anywhere}#keys{white-space:pre-wrap;color:#9de3b4;overflow-wrap:anywhere}</style></head><body><main class="wrap"><h1>AutoMotor License Admin</h1><p>Create 30-day license keys, inspect activations, renew, revoke, or reset device binding.</p><section class="card"><h3>Admin access</h3><label>Admin Secret</label><input id="secret" type="password" autocomplete="current-password" placeholder="Enter ADMIN_SECRET"><button id="save">Unlock Admin</button><button class="secondary" id="clear">Lock</button><div id="status" role="status"></div></section><section class="card"><h3>Create licenses</h3><div class="row"><div><label>Number of keys (1–100)</label><input id="count" type="number" min="1" max="100" value="1"></div><div><label>Label / customer note (optional)</label><input id="label" maxlength="120" placeholder="Customer or order reference"></div></div><button id="create">Generate License Key(s)</button><div id="keys"></div></section><section class="card"><h3>Issued licenses</h3><button id="refresh" class="secondary">Refresh list</button><div id="table"></div></section><p class="muted">Keep the admin secret private. Generated keys are shown once; the server stores only their hashes.</p></main><script>
const $=id=>document.getElementById(id);let secret=sessionStorage.getItem('am_admin_secret')||'';$('secret').value=secret;
function status(s){$('status').textContent=s}async function api(path,method='GET',body){if(!secret)throw Error('Enter Admin Secret first.');const r=await fetch(path,{method,headers:{'Content-Type':'application/json','Authorization':'Bearer '+secret},body:body?JSON.stringify(body):undefined,cache:'no-store'});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Request failed '+r.status);return d}
$('save').onclick=async()=>{secret=$('secret').value.trim();sessionStorage.setItem('am_admin_secret',secret);try{await api('/api/admin/licenses');status('Admin access verified.');await refresh()}catch(e){status(e.message)}};$('clear').onclick=()=>{secret='';sessionStorage.removeItem('am_admin_secret');$('secret').value='';status('Admin locked.');$('table').innerHTML=''};
$('create').onclick=async()=>{try{const d=await api('/api/admin/licenses','POST',{count:Number($('count').value),label:$('label').value});$('keys').textContent=d.keys.join('\n')+'\n\n'+d.note;status('Created '+d.keys.length+' license(s). Copy the key(s) now.');await refresh()}catch(e){status(e.message)}};
async function refresh(){try{const d=await api('/api/admin/licenses');$('table').innerHTML='<table><thead><tr><th>ID</th><th>Status</th><th>Label</th><th>Activated</th><th>Expires</th><th>Device</th><th>Actions</th></tr></thead><tbody>'+d.licenses.map(x=>'<tr><td>'+esc(x.id)+'</td><td>'+esc(x.status)+'</td><td>'+esc(x.label||'')+'</td><td>'+esc(fmt(x.activated_at))+'</td><td>'+esc(fmt(x.expires_at))+'</td><td>'+esc(x.device_id||'—')+'</td><td>'+ (x.status==='revoked'?'—':'<button data-act="renew" data-id="'+esc(x.id)+'">Renew 30d</button><button class="secondary" data-act="reset-device" data-id="'+esc(x.id)+'">Reset device</button><button class="danger" data-act="revoke" data-id="'+esc(x.id)+'">Revoke</button>')+'</td></tr>').join('')+'</tbody></table>';status('Loaded '+d.licenses.length+' licenses.')}catch(e){status(e.message)}}function fmt(v){return v?new Date(v).toLocaleString():'—'}function esc(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
$('refresh').onclick=refresh;$('table').onclick=async e=>{const b=e.target.closest('button[data-act]');if(!b)return;const {act,id}=b.dataset;if(!confirm(act==='revoke'?'Revoke this license?':act==='reset-device'?'Reset device binding? Next activation starts a new 30-day term.':'Renew this license for 30 days?'))return;try{await api('/api/admin/licenses/'+encodeURIComponent(id)+'/'+act,'POST',{});status('Action completed: '+act);await refresh()}catch(err){status(err.message)}};
if(secret)api('/api/admin/licenses').then(refresh).catch(e=>status(e.message));
</script></body></html>
